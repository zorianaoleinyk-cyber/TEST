services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo-init:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: "${ODOO_DB_PASSWORD:?Set ODOO_DB_PASSWORD in .env}"
    command: ["odoo", "--database=odoo", "--init=stock,sale_management,purchase,mrp", "--load-language=uk_UA", "--without-demo=all", "--stop-after-init"]
    volumes:
      - odoo-data:/var/lib/odoo
    restart: "no"

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
      odoo-init:
        condition: service_completed_successfully
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: "${ODOO_DB_PASSWORD:?Set ODOO_DB_PASSWORD in .env}"
    volumes:
      - odoo-data:/var/lib/odoo
    restart: unless-stopped

volumes:
  postgres-data:
  odoo-data:

